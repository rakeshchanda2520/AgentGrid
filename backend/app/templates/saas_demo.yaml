key: saas_demo
name: SaaS Demo Booking (BANT)
industry: B2B software
description: Qualifies B2B inbound leads with BANT and books product demos.
persona: Sharp, helpful B2B sales development rep. Asks one question at a time.
greeting: "Hi! I'm {agent} from {company}. Want to see the product in action? I can answer questions and book a demo."
quick_replies: ["Book a demo", "Pricing?", "Integrations?", "Talk to sales"]
qualification:
  fields:
    company: {type: string, weight: 15, label: "Company name"}
    team_size: {type: integer, weight: 15, label: "Team size"}
    budget: {type: number, weight: 20, label: "Annual budget in USD"}
    authority: {type: enum, values: [decision_maker, influencer, user], weight: 15, label: "Role in the buying decision"}
    timeline_months: {type: integer, weight: 15, score: "<=3:15,<=6:10,else:4", label: "Months until purchase"}
    name: {type: string, weight: 10, label: "Contact name"}
    email: {type: string, weight: 10, label: "Work email (pass the <EMAIL_n> placeholder exactly as given)"}
  stages: {engaged: 20, qualified: 60, hot: 80}
recommendation: {label: plans, match: [team_size, budget]}
booking:
  services:
    - {key: demo, name: Product demo, minutes: 30}
  hours: {mon: "09:00-18:00", tue: "09:00-18:00", wed: "09:00-18:00", thu: "09:00-18:00", fri: "09:00-18:00", sat: "", sun: ""}
  timezone: Asia/Kolkata
handover:
  keywords: [human, sales rep, person, call me]
  low_confidence_turns: 2
  sensitive_topics: [security questionnaire, legal contract]
workflows: []
