# Render Blueprint: AgentGrid API (Docker) + PostgreSQL 16 with pgvector.
# Render → New → Blueprint → pick this repo. Then set the values marked `sync: false` in the dashboard.
services:
  - type: web
    name: agentgrid-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter            # always-on; the free plan sleeps after 15 min idle (first request then takes ~1 min)
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentgrid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_KEY
        generateValue: true
      - key: CONSOLE_URL
        sync: false          # e.g. https://agentgrid.vercel.app
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_API_KEY
        sync: false          # empty → built-in offline demo model
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: LLM_CHEAP_MODEL
        value: openai/gpt-4o-mini
      - key: EMBEDDINGS
        value: fastembed
      - key: DEMO_PASSWORD
        value: "AgentGrid#Demo2026"

databases:
  - name: agentgrid-db
    plan: basic-256mb        # "free" also works for a short demo (Render deletes free databases after 30 days)
    region: singapore
    postgresMajorVersion: "16"
